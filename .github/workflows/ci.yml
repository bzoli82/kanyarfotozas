name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest

    services:
      postgres:
        # Sima PostgreSQL — az éles cél (Hetzner CX22 + Coolify) is PostGIS NÉLKÜL fut.
        # Az events migráció feltételes: PostGIS híján sima b-tree indexet készít, a GPS
        # sugaras keresés pedig alapból KI (App\Services\GeoSearchSettings). Ha később
        # kell a PostGIS-es GPS-keresés, cseréld az image-t `postgis/postgis:16-3.4`-re
        # és told vissza a "CREATE EXTENSION postgis" lépést.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kanyarfotozas_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # A phpunit.xml <env> bejegyzései nem `force`-oltak, így ezek a valódi
      # környezeti változók felülírják a bennük lévő (helyi) DB-jelszót.
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: kanyarfotozas_test
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      # A teszt-futáshoz ne kelljen cache/session/jobs tábla (phpunit.xml is ezt állítja).
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, pgsql, gd, exif, intl, zip, bcmath
          coverage: none
          tools: composer:v2

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Migrate (schema smoke test)
        run: php artisan migrate --force

      - name: Run tests
        run: php artisan test

  pint:
    name: Code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer:v2

      - name: Composer cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/composer
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Laravel Pint
        run: vendor/bin/pint --test

  build:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Vite build
        run: npm run build
